spring.application.name=Server

# 루프백에만 묶는다. Spring 기본값(0.0.0.0)이면 같은 와이파이의 아무나 접속할 수 있고,
# /debug/** 는 인증이 없다. 일부러 남에게 보여줄 때만 SERVER_ADDRESS=0.0.0.0 으로 덮어쓴다
server.address=${SERVER_ADDRESS:127.0.0.1}

# DB 접속 - 기본값은 로컬 docker-compose 기준. 배포 시에는 환경변수로 덮어쓴다
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roomescape}
spring.datasource.username=${DB_USER:roomescape}
spring.datasource.password=${DB_PASSWORD:localdev}
# 커넥션 풀. **반드시 collector.site-concurrency 보다 커야 한다.**
# 사이트 스레드가 저장할 때 하나씩 쥐는데, 풀이 같거나 작으면 수집이 커넥션을 다 차지해
# 그동안 조회 API 가 대기한다 — 남는 값은 그 여유분이다 (16 + 웹 몫 8).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:24}

# 인증 없는 확인용 엔드포인트. 기본 꺼짐 — 로컬에서 볼 때만 DEBUG_ENDPOINTS=true 로 띄운다
debug.endpoints-enabled=${DEBUG_ENDPOINTS:false}

# 조회 API 를 부를 수 있는 출처. Floduler 가 배포된 곳 + 로컬 개발 서버
api.cors.allowed-origins=${API_CORS_ORIGINS:https://choieuihyun.github.io,http://localhost:5173,http://127.0.0.1:5173}

# 알림 신청자를 Floduler 의 Firebase 로그인으로 확인한다 (D12).
# 비밀값이 아니다 — 브라우저에도 그대로 내려가는 "어느 프로젝트인가" 이름이다
auth.firebase.project-id=${FIREBASE_PROJECT_ID:roomescapescheduler}

# 스키마는 Flyway 가 만든다 (src/main/resources/db/migration).
# validate 는 엔티티와 실제 테이블이 어긋나면 기동을 막는다 — 조용히 틀어진 채로 도는 것보다 낫다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 수집 주기 (밀리초). 이전 바퀴가 **끝난 뒤부터** 재는 간격이라(fixedDelay) 수집이 겹치지 않는다.
# 겹치면 같은 호스트에 두 바퀴가 동시에 붙어 초당 1회 미만(D13)이 깨진다.
# **그래서 실제 간격은 5분이 아니라 5분 + 수집시간이다** — 실측 2026-09-01 은 436~471초
# (수집 135~170초 · 7호스트 · 265~344요청)
# **이 값은 스케줄 간격에만 쓴다.** 바퀴 번호는 DB 카운터(SweepTicker)가 센다 —
# 전에는 여기서 번호까지 뽑았는데(now / interval-ms), 실제 주기가 470초라 어긋나서
# 날짜 순환이 굶었다 (아키텍처 D14 정정). 같은 값을 두 뜻으로 쓰면 그중 하나가 틀린다
collector.interval-ms=300000
# 가까운 창. 이 안의 날짜는 요일 등급대로 자주 본다 (토·일 매 바퀴 · 금 2바퀴마다 · 평일 순환)
collector.range-days=7
# 먼 창의 끝. range-days 부터 여기까지는 한 바퀴에 하나씩만 본다 (8일치를 돌아가며).
# **지점마다 예약 창이 다르다** — 여기까지 여는 지점만 실제로 요청한다(각 Branch 의 openDays).
# 2026-08-31 기준 지구별 대구(2주)뿐이고, 나머지는 어댑터가 걸러 낸다.
# 이 값을 range-days 와 같게 두면 먼 창이 사라져 예전 동작이 된다
collector.far-range-days=15
# 한 요청과 다음 요청 사이 간격. 초당 1회 미만을 지키기 위해 비워둔다.
# **호스트별로** 적용된다 (HostRateLimiter). 서버가 다르면 서로 기다리지 않는다
collector.request-delay-ms=1200
# 동시에 긁을 **사이트** 수 (지점 수가 아니다).
# 지점이 달라도 서버가 같으면 동시에 긁으면 안 된다 — 플레이33은 4지점이 play33.kr 한 대다.
#
# **호스트 수보다 크게 잡는 게 맞다.** 속도 제한은 호스트별로 걸리므로(D13),
# 호스트 수를 넘는 스레드는 아무 일도 안 하고(코드가 호스트 수로 깎는다),
# 호스트 수보다 적으면 서로 기다리기만 한다 — 9곳인데 4로 두면 3파도로 쪼개져
# 한 바퀴가 최대 3배가 되는데, 로그의 "한 바퀴 N초" 만 봐서는 원인이 안 보인다.
collector.site-concurrency=${COLLECTOR_SITE_CONCURRENCY:16}
# 주기 수집은 **기본 꺼짐**이다.
# 개발 중에는 손으로 /debug/collect 만 부르고, 실제로 돌릴 기기(집/서버)에서만 켠다.
#   COLLECTOR_ENABLED=true ./gradlew bootRun
# 기본을 켜두면 개발하려고 앱을 띄울 때마다 매장 사이트를 긁게 된다.
collector.play33.enabled=${COLLECTOR_ENABLED:false}

# 알림 발송 경로. log = 로그에만 남긴다(기본), fcm = 실제 푸시
notify.channel=${NOTIFY_CHANNEL:log}
# 파이어베이스 **서비스 계정 키 파일** 경로. notify.channel=fcm 일 때만 필요하다.
# 비밀값이라 파일로 받는다 — 개인키에 줄바꿈이 있어서 .env 한 줄에 넣으면 거의 항상 깨진다.
# 커밋 금지 (.gitignore 에 있다)
notify.fcm.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
# 알림을 눌렀을 때 열 주소. 없으면 눌러도 아무 일도 안 일어난다
notify.fcm.link=${FCM_LINK:https://choieuihyun.github.io/RoomEscapeScheduler/}
# 같은 자리를 다시 알리기까지의 최소 간격 (분). D11 — 1시간.
# "놓쳤어도 다음 기회" 가 이 서비스의 가치라서 평생 1회로 두지 않는다
# 한 사람이 걸 수 있는 감시 수. **크롤 부하와는 무관하다**(D3) — 우리 DB 를 지키는 값이다.
# 쿨다운 조회의 N+1 을 고치면 올릴 수 있다 (작업명세서 M5)
watch.max-per-user=${WATCH_MAX_PER_USER:3}
notify.cooldown-minutes=${NOTIFY_COOLDOWN_MINUTES:60}
