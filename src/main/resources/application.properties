spring.application.name=Server

# 루프백에만 묶는다. Spring 기본값(0.0.0.0)이면 같은 와이파이의 아무나 접속할 수 있고,
# /debug/** 는 인증이 없다. 일부러 남에게 보여줄 때만 SERVER_ADDRESS=0.0.0.0 으로 덮어쓴다
server.address=${SERVER_ADDRESS:127.0.0.1}

# DB 접속 - 기본값은 로컬 docker-compose 기준. 배포 시에는 환경변수로 덮어쓴다
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roomescape}
spring.datasource.username=${DB_USER:roomescape}
spring.datasource.password=${DB_PASSWORD:localdev}

# 인증 없는 확인용 엔드포인트. 기본 꺼짐 — 로컬에서 볼 때만 DEBUG_ENDPOINTS=true 로 띄운다
debug.endpoints-enabled=${DEBUG_ENDPOINTS:false}

# 조회 API 를 부를 수 있는 출처. Floduler 가 배포된 곳 + 로컬 개발 서버
api.cors.allowed-origins=${API_CORS_ORIGINS:https://choieuihyun.github.io,http://localhost:5173,http://127.0.0.1:5173}

# 스키마는 Flyway 가 만든다 (src/main/resources/db/migration).
# validate 는 엔티티와 실제 테이블이 어긋나면 기동을 막는다 — 조용히 틀어진 채로 도는 것보다 낫다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 수집 주기 (밀리초). 끔 다음부터 다음 시작까지의 간격이라 수집이 겹치지 않는다
collector.play33.interval-ms=300000
# 한 요청과 다음 요청 사이 간격. 초당 1회 미만을 지키기 위해 비워둔다
collector.play33.request-delay-ms=1200
# 주기 수집은 **기본 꺼짐**이다.
# 개발 중에는 손으로 /debug/collect 만 부르고, 실제로 돌릴 기기(집/서버)에서만 켠다.
#   COLLECTOR_ENABLED=true ./gradlew bootRun
# 기본을 켜두면 개발하려고 앱을 띄울 때마다 매장 사이트를 긁게 된다.
collector.play33.enabled=${COLLECTOR_ENABLED:false}
