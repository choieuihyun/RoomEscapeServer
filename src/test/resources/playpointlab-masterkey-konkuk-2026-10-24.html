<script>
	
	$(function() {

	    if(is_first)
		{
			//console.log("처음이다!");
		    //return;
		}
		is_first = true;

		document.querySelectorAll("[data-story]").forEach((button) => {
			button.addEventListener("click", () => {
				if (storyText) storyText.textContent = button.dataset.story || "";
				openModal(storyModal);
			});
		});

		document.querySelectorAll(".booking-slot.available").forEach((slot) => {
			slot.addEventListener("click", () => {
				const room = slot.closest("[data-room-id]");
				const bookingTime = slot.dataset.bookingTime || "";

				bookingRequest.date_id = selected_date;
				bookingRequest.sequence = bookingTime.replace(":", "");
				bookingRequest.room_name = room?.dataset.roomId || "";
				bookingRequest.room_realname = room?.dataset.roomName || slot.dataset.bookingRoom || "";

				if (modalTitle) modalTitle.textContent = `${bookingTime} ${bookingRequest.room_realname}`;
				bookingModal?.querySelectorAll("input").forEach((input) => {
				input.value = "";
				});

				booking_date.textContent = addWeekday(selected_date);
				if (bookingGuide && bookingTermsContent) {
					const guide = bookingGuide.cloneNode(true);
					guide.removeAttribute("data-booking-guide");
					bookingTermsContent.replaceChildren(guide);
				}
				showBookingTerms();
				setBookingStatus("");
				openModal(bookingModal);
				if (bookingTermsContent) {
					bookingTermsContent.scrollTop = 0;
					bookingTermsContent.focus();
				}
				//console.log(bookingRequest); // 테스트용
			});
		});

	})

</script>
