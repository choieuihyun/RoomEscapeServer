# 테스트 전용. 컨텍스트 로딩과 저장 로직 검증에만 쓴다 —
# 실제 운영 DB 는 Postgres 이고, 방언 차이가 걸릴 만한 것은 여기서 검증하지 않는다.
spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# 마이그레이션은 Postgres 문법이라 H2 에서 돌리지 않는다. 스키마는 엔티티에서 만든다
spring.flyway.enabled=false

# 테스트가 실제 매장 사이트를 때리지 않게 한다
collector.play33.enabled=false
