# 배포용. 로컬 개발은 docker-compose.yml (DB 만) 을 쓴다.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 비밀값은 같은 디렉터리의 .env 에서 읽는다 (.env.example 참고). .env 는 커밋하지 않는다.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: roomescape
      POSTGRES_USER: roomescape
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정해야 한다}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 포트를 열지 않는다. 같은 도커 네트워크의 app 만 붙으면 된다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomescape -d roomescape"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/roomescape
      DB_USER: roomescape
      DB_PASSWORD: ${DB_PASSWORD:?}
      # 여기서만 켠다. 개발 기기에서는 꺼져 있어야 한다
      COLLECTOR_ENABLED: "true"
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-https://choieuihyun.github.io}
      # 인증이 없는 엔드포인트다. 배포에서는 반드시 꺼 둔다 (Caddy 도 라우팅하지 않는다)
      DEBUG_ENDPOINTS: "false"
      # 감시 API 토큰을 검증할 대상. 비밀값이 아니다 — 브라우저에도 그대로 내려가는 이름이다
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-roomescapescheduler}
      # log = 로그에만 남긴다. fcm 으로 바꾸려면 아래 키 파일이 있어야 한다
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-log}
      NOTIFY_COOLDOWN_MINUTES: ${NOTIFY_COOLDOWN_MINUTES:-60}
      # 컨테이너 **안쪽** 경로다. 바깥 파일은 아래 volumes 가 여기로 붙여 준다
      FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase-service-account.json
      # 알림을 눌렀을 때 열 주소
      FCM_LINK: ${FCM_LINK:-https://choieuihyun.github.io/RoomEscapeScheduler/}
      TZ: Asia/Seoul
    volumes:
      # 파이어베이스 서비스 계정 키. **읽기 전용**으로 넣는다 — 앱이 고쳐 쓸 이유가 없고,
      # 컨테이너가 뚫려도 이 파일은 못 바꾼다.
      #
      # 기본값이 /dev/null 인 이유: 도커는 **없는 경로를 마운트하면 빈 디렉터리를 만든다.**
      # 여기에 `./firebase-service-account.json` 을 기본값으로 두면, 키를 넣기 전에
      # 배포하는 순간 그 이름의 **디렉터리**가 생기고, 나중에 진짜 파일을 올리려 할 때
      # "이미 있다" 며 막힌다. /dev/null 은 항상 존재하니 그 사고가 없다.
      # 알림을 켤 때 .env 에서 FIREBASE_CREDENTIALS_PATH 로 진짜 경로를 준다
      - ${FIREBASE_CREDENTIALS_PATH:-/dev/null}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 을 .env 에 설정해야 한다}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급받은 인증서. 지우면 매번 재발급받는다
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
